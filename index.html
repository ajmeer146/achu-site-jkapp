<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Professional Corporate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="#" class="logo">Corporate Platform</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/features">Features</a>
        <a href="/pricing">Pricing</a>
      </nav>
    </div>
  </header>

  <main class="login-page">
    <div class="container">
      <section class="login-card">
        <h2>Sign In</h2>
        <p>Access your account and continue working</p>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
            <span class="toggle-password" onclick="togglePasswordVisibility()">
              Show
            </span>
          </div>

          <button type="submit" class="btn btn-primary">Sign In</button>

          <p class="form-footer">
            <a href="#" class="link-forgot">Forgot password?</a>
            <a href="#" class="link-signup">Create account</a>
          </p>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <section>
        <p>&copy; 2024 Corporate Platform. All rights reserved.</p>
        <span>Footer</span>
        <ul class="footer-links">
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Service</a></li>
        </ul>
      </section>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
